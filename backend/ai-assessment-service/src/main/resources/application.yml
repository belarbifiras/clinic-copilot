spring:
  application:
    name: ai-assessment-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # le schéma est géré par Flyway (db/migration)
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  security:
    # ATTENTION : true = développement seulement (aucune authentification).
    # Doit passer à false (et JWT branché) avant toute démonstration réelle.
    permit-all: ${APP_SECURITY_PERMIT_ALL:true}

ai:
  prompt-version: triage-v4
  doctor-summary-language: fr
  low-confidence-threshold: 0.5
  clarification-enabled: true
  max-concurrent-requests: 1     # une requête LLM à la fois (économie de mémoire)
  queue-wait-seconds: 90
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
    model: ${AI_MODEL:medgemma:4b}
    connect-timeout-seconds: 3
    read-timeout-seconds: 120
    num-ctx: 3072
    num-predict: 800
    temperature: 0.1
    keep-alive: 30m
  # Codes de spécialités : DOIVENT être alignés avec doctor-directory-service (à vérifier avec le collègue)
  allowed-specialties:
    - general_medicine
    - cardiology
    - pulmonology
    - neurology
    - gastroenterology
    - dermatology
    - ent
    - ophthalmology
    - orthopedics
    - gynecology
    - pediatrics
    - psychiatry
    - urology
    - endocrinology

# Médecin le plus proche (appel serveur à serveur, annuaire public). Vide = fonction désactivée.
# Exemple dans Docker Compose : DOCTOR_DIRECTORY_URL=http://doctor-directory-service:8082 (port à vérifier)
directory:
  base-url: ${DOCTOR_DIRECTORY_URL:}
  timeout-seconds: 3