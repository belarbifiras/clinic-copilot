server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: appointment-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clinic_appointments}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# --- Feign client URLs ---
services:
  identity-profile:
    url: ${IDENTITY_PROFILE_URL:http://localhost:8081}
  doctor-directory:
    url: ${DOCTOR_DIRECTORY_URL:http://localhost:8082}

# --- RabbitMQ configuration ---
app:
  rabbitmq:
    exchange: appointment.exchange
    routing-keys:
      booked: appointment.booked
      cancelled: appointment.cancelled
      rescheduled: appointment.rescheduled
      completed: appointment.completed
    queues:
      booked: appointment.booked.queue
      cancelled: appointment.cancelled.queue
      rescheduled: appointment.rescheduled.queue
      completed: appointment.completed.queue
    doctor-validated-queue: doctor.validated.queue


# --- Keycloak (validation des tokens) ---
  security:
    keycloak:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/clinic}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/clinic/protocol/openid-connect/certs}

# --- OpenAPI ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.clinic.appointment_service: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true