spring:
  datasource:
    url: jdbc:h2:mem:appointment_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db
  rabbitmq:
    listener:
      simple:
        auto-startup: false
security:
  jwt:
    # Test-only 256-bit key; never use this value outside the test profile.
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
