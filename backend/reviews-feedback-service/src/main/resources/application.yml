server:
  port: 8088

spring:
  application:
    name: reviews-feedback-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clinic_reviews}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  security:
    keycloak:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/clinic}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/clinic/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health