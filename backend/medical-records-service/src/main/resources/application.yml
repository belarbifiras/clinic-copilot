server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: medical-records-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/clinic_records}
    username: ${DB_USER:records_user}
    password: ${DB_PASSWORD:records_pass}      # À CHANGER EN PRODUCTION
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}             # dev. Production : Flyway/Liquibase + "validate"
    open-in-view: false

app:
  security:
    keycloak:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/clinic}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/clinic/protocol/openid-connect/certs}
    internal-api-key: ${INTERNAL_API_KEY:CHANGE_ME_DEV_ONLY_internal_api_key}
  audit:
    base-url: ${AUDIT_SERVICE_URL:http://localhost:8086}
    timeout-ms: ${CLIENT_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true