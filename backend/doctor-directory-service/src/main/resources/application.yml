server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: doctor-directory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clinic_doctors}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus    
 
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  security:
    keycloak:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/clinic}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/clinic/protocol/openid-connect/certs}
  storage:
    diplomas-dir: ${DIPLOMAS_DIR:./data/diplomas}
  clients:
    identity-service:
      base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
      internal-api-key: ${APP_INTERNAL_API_KEY:changeme-internal-key}