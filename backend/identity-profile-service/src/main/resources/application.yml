server:
  port: 8081

spring:
  application:
    name: identity-profile-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clinic_identity}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/clinic}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/clinic/protocol/openid-connect/certs}

keycloak:
  server-url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: clinic
  admin-client-id: identity-service
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:change_me_client_secret_1234}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

patient:
  service:
    url: ${PATIENT_SERVICE_URL:http://localhost:8090}

services:
  patient-url: ${PATIENT_PROFILE_URL:http://localhost:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus        # ajoute prometheus à la liste existante
  # ... tes autres clés existantes restent ici ...
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

app:
  internal:
    api-key: ${APP_INTERNAL_API_KEY:changeme-internal-key}