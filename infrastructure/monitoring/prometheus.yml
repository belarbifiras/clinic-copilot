global:
  scrape_interval: 15s

scrape_configs:
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - identity-profile-service:8081
          - doctor-directory-service:8082
          - appointment-service:8084
          - medical-records-service:8086
          - notification-service:8087
          - reviews-feedback-service:8088
          - admin-audit-service:8089
          - patient-profile-service:8090
          - ai-assessment-service:8080
          - eureka-server:8761
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: application