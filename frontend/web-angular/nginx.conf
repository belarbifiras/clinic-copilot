server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /realms/ {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}